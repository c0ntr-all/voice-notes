name: voice-notes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./server:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3307"
      DB_DATABASE: ${MYSQL_DATABASE:-voice_notes}
      DB_USERNAME: ${MYSQL_USER:-voice}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      # Обычный хостинг: задача выполняется в том же HTTP-запросе, без Redis и воркеров.
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: file
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voice_notes}
      MYSQL_USER: ${MYSQL_USER:-voice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"${MYSQL_ROOT_PASSWORD:-root}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  quasar:
    build:
      context: .
      dockerfile: Dockerfile
      target: quasar
    restart: unless-stopped
    ports:
      - "${QUASAR_PORT:-9000}:9000"
    volumes:
      - ./app:/app
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8080}
    tty: true
    stdin_open: true

volumes:
  mysql_data:
